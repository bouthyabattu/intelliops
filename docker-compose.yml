version: '3.9'

networks:
  intelliops-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:

services:
  # ==========================================
  # DATA LAYER
  # ==========================================

  # PostgreSQL 16 + pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: intelliops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intelliops}
      POSTGRES_USER: ${POSTGRES_USER:-intelliops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intelliops_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - intelliops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliops_user -d intelliops"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 (Caching, Session, Pub/Sub)
  redis:
    image: redis:7-alpine
    container_name: intelliops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - intelliops-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Kafka (KRaft mode - no Zookeeper needed)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: intelliops-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - intelliops-net

  # MinIO Object Storage (S3 API + Console)
  minio:
    image: minio/minio:latest
    container_name: intelliops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - intelliops-net

  # Keycloak 24 (OIDC Identity & Access Management)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: intelliops-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./infrastructure/docker/keycloak:/opt/keycloak/data/import
    networks:
      - intelliops-net

  # ==========================================
  # APPLICATION SERVICES
  # ==========================================

  # Spring Boot Core Service (Port 8080)
  core-service:
    build:
      context: ./apps/core-service
      dockerfile: ../../infrastructure/docker/Dockerfile.core
    container_name: intelliops-core-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/intelliops
      SPRING_DATASOURCE_USERNAME: intelliops_user
      SPRING_DATASOURCE_PASSWORD: intelliops_secure_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    networks:
      - intelliops-net

  # FastAPI AI Service (Port 8000)
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: ../../infrastructure/docker/Dockerfile.ai
    container_name: intelliops-ai-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://intelliops_user:intelliops_secure_password@postgres:5432/intelliops
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SIMULATE_AI_WHEN_NO_KEY: ${SIMULATE_AI_WHEN_NO_KEY:-true}
    networks:
      - intelliops-net

  # Realtime WebSocket Service (Port 4000)
  realtime-service:
    build:
      context: ./apps/realtime-service
      dockerfile: ../../infrastructure/docker/Dockerfile.realtime
    container_name: intelliops-realtime-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: http://localhost:3000
    networks:
      - intelliops-net

  # Next.js 14 Web Frontend (Port 3000)
  web:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/Dockerfile.web
    container_name: intelliops-web
    restart: unless-stopped
    depends_on:
      - core-service
      - ai-service
      - realtime-service
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_CORE_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_AI_API_URL: http://localhost:8000/api/v1/ai
      NEXT_PUBLIC_WS_URL: http://localhost:4000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-supersecretnextauthsessionsecretkey123456789}
    networks:
      - intelliops-net
