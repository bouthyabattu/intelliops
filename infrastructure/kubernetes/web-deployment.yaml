apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: intelliops
  labels:
    app: web-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
        - name: web-frontend
          image: intelliops/web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: intelliops-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: intelliops
spec:
  selector:
    app: web-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
