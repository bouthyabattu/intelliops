apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: intelliops
  labels:
    app: core-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
    spec:
      containers:
        - name: core-service
          image: intelliops/core-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: intelliops-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: intelliops
spec:
  selector:
    app: core-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
